- name: Ensure firewalld + python bindings installed
  ansible.builtin.dnf:
    name:
      - firewalld
      - python3-firewall
    state: present

- name: Ensure firewalld is running
  ansible.builtin.systemd_service:
    name: firewalld
    state: started
    enabled: true

- name: Allow tailscale interface
  ansible.posix.firewalld:
    zone: trusted
    interface: tailscale0
    permanent: true
    state: enabled

- name: Allow HTTP/HTTPS
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    state: enabled
  loop:
    - http
    - https

- name: Allow flannel VXLAN
  ansible.posix.firewalld:
    port: 8472/udp
    permanent: true
    state: enabled

- name: Trust k3s/flannel/cni interfaces
  ansible.posix.firewalld:
    zone: trusted
    interface: "{{ item }}"
    permanent: true
    state: enabled
  loop:
    - cni0
    - flannel.1

- name: Reload firewalld
  ansible.builtin.command: firewall-cmd --reload
  changed_when: true
